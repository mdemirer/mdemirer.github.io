const UI = {
  about:     { en: "About",                     tr: "Hakkımda" },
  education: { en: "Education",                 tr: "Eğitim" },
  research:  { en: "Research",                  tr: "Araştırma" },
  pubs:      { en: "Publications",              tr: "Yayınlar" },
  pubsNote:  { en: "The full list is on NASA ADS.", tr: "Tam liste NASA ADS'te." },
  talks:     { en: "Talks and posters",         tr: "Konuşmalar ve posterler" },
  talk:      { en: "Talk",                      tr: "Konuşma" },
  poster:    { en: "Poster",                    tr: "Poster" },
  teaching:  { en: "Teaching and outreach",     tr: "Öğretim ve bilim iletişimi" },
  projects:  { en: "Projects",                  tr: "Projeler" },
  funding:   { en: "Scholarships and funding",  tr: "Burslar ve destekler" },
  privacy:   { en: "This page uses no cookies, analytics or third-party scripts.",
               tr: "Bu sayfa çerez, ziyaretçi takibi ya da üçüncü taraf kodu kullanmaz." },
  switchTo:  { en: "Türkçe",                    tr: "English" }
};

/* ---------------------- buradan sonrası çizim kodu ---------------------- */
(function () {
  const KEY = "md-home.lang";
  let lang;
  try { lang = localStorage.getItem(KEY); } catch (e) {}
  if (lang !== "tr" && lang !== "en") {
    lang = (navigator.language || "").toLowerCase().startsWith("tr") ? "tr" : "en";
  }

  const $ = (id) => document.getElementById(id);
  const t = (v) => (v && typeof v === "object" && !Array.isArray(v)) ? v[lang] : v;
  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const k in (attrs || {})) n.setAttribute(k, attrs[k]);
    for (const c of kids) if (c != null && c !== "") n.append(c);
    return n;
  };
  const link = (href, text) => {
    const a = el("a", { href }, text);
    if (/^https?:/.test(href)) a.rel = "noopener";
    return a;
  };
  // "**Ad**" -> <b>Ad</b>
  const bolded = (s) => {
    const f = document.createDocumentFragment();
    s.split(/(\*\*[^*]+\*\*)/).forEach((p) => {
      if (p.startsWith("**")) f.append(el("b", null, p.slice(2, -2)));
      else if (p) f.append(p);
    });
    return f;
  };
  // Başlık + sağda tarih + alt satır + açıklama
  const plainItem = (x) => el("li", null,
    el("div", { class: "head" },
      el("div", { class: "title" }, x.url ? link(x.url, t(x.title)) : t(x.title)),
      x.when ? el("span", { class: "when" }, t(x.when)) : null),
    x.place ? el("div", { class: "sub" }, t(x.place)) : null,
    x.text ? el("p", { class: "desc" }, t(x.text)) : null);
  // Sol sütunda yıl
  const datedItem = (year, ...body) => el("li", null,
    el("div", { class: "year" }, String(year)),
    el("div", null, ...body));

  function section(key, list, fill) {
    const sec = $(key).closest("section");
    sec.hidden = !list || list.length === 0;
    $("h-" + key).textContent = t(UI[key]);
    $(key).replaceChildren(...(list || []).map(fill));
  }

  function render() {
    document.documentElement.lang = lang;
    $("lang").textContent = UI.switchTo[lang];
    $("lang").setAttribute("lang", lang === "tr" ? "en" : "tr");

    $("name").textContent = SITE.name;
    $("role").textContent = t(SITE.role);

    const links = $("links"); links.replaceChildren();
    for (const l of SITE.links) {
      if (!l.url) continue;
      const href = l.url === "mailto" ? "mailto:" + SITE.email.join("@") : l.url;
      links.append(el("li", null, link(href, t(l.label))));
    }

    $("h-about").textContent = t(UI.about);
    $("about").replaceChildren(...t(SITE.about).map((p) => el("p", null, p)));

    section("education", SITE.education, plainItem);

    $("h-research").textContent = t(UI.research);
    $("research").replaceChildren(...SITE.research.flatMap((r) => [
      el("dt", null, t(r.title)), el("dd", null, t(r.text))
    ]));

    $("h-pubs").textContent = t(UI.pubs);
    $("pubs").replaceChildren(...SITE.publications.map((p) => {
      const venue = el("div", { class: "venue" }, el("span", null, p.venue));
      if (p.doi) venue.append(link("https://doi.org/" + p.doi, "DOI"));
      if (p.arxiv) venue.append(link("https://arxiv.org/abs/" + p.arxiv, "arXiv"));
      return datedItem(p.year,
        el("div", { class: "title" }, p.title),
        el("div", { class: "sub" }, bolded(p.authors)),
        venue);
    }));
    const ads = SITE.links.find((l) => l.label === "NASA ADS");
    $("pubs-note").replaceChildren();
    if (ads && ads.url) {
      const [before, after] = t(UI.pubsNote).split("NASA ADS");
      $("pubs-note").append(before, link(ads.url, "NASA ADS"), after);
    }

    section("talks", SITE.talks, (x) => datedItem(x.year,
      el("div", { class: "title" }, x.title),
      el("div", { class: "sub" }, t(UI[x.kind]) + ", " + t(x.event))));

    section("teaching", SITE.teaching, plainItem);
    $("h-projects").textContent = t(UI.projects);
    $("projects").replaceChildren(...SITE.projects.map((x) =>
      plainItem({ title: x.title, url: x.url, text: x.text, place: x.place })));
    // Projelerde "resmi değildir" notu açıklamanın altında dursun
    $("projects").querySelectorAll("li").forEach((li) => {
      const sub = li.querySelector(".sub"), desc = li.querySelector(".desc");
      if (sub && desc) li.append(sub);
    });
    section("funding", SITE.funding, plainItem);

    $("updated").textContent = t(SITE.updated);
    $("privacy").textContent = t(UI.privacy);
    document.title = SITE.name;
  }

  $("lang").addEventListener("click", () => {
    lang = lang === "tr" ? "en" : "tr";
    try { localStorage.setItem(KEY, lang); } catch (e) {}
    render();
  });

  render();
})();
</script>
